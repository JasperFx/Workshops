# Scrapes the OTEL collector's Prometheus endpoint. Section 7 only.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["jaeger:8889"]

  # The Help Desk API runs on the host, not in compose. On Docker Desktop
  # host.docker.internal is how a container reaches it.
  - job_name: helpdesk-api
    static_configs:
      - targets: ["host.docker.internal:5199"]
    metrics_path: /metrics
